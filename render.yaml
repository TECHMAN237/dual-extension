# Render Blueprint for the DOUALA AI backend.
# Deploy: render.com → New → Blueprint → select this repository.
# Render asks for the value marked `sync: false` (AI_API_KEY) when the Blueprint is
# created. See docs/DEPLOYMENT.md.
services:
  - type: web
    name: douala-ai-backend
    runtime: node
    # Free plan: the service sleeps after 15 min without traffic (wake-up ≈ 30–60 s)
    # and its disk is wiped on every restart, so the knowledge base is read from the
    # versioned file data/knowledge/douala.json (see ALLOW_EPHEMERAL_STORAGE below).
    plan: free
    rootDir: .
    # pnpm is installed with npm, not Corepack: Corepack in older Node 22 releases rejects
    # the npm registry's current signing keys and the build fails before installing anything.
    buildCommand: npm install -g pnpm@10.28.0 && pnpm install --frozen-lockfile && pnpm --filter @douala-ai/backend... build
    # Plain node (no --env-file): Render injects the environment variables itself.
    startCommand: cd apps/backend && node dist/index.js
    healthCheckPath: /api/health
    envVars:
      # Latest Node 22.x on Render.
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      # --- AI provider: OpenRouter free models ---------------------------------
      - key: AI_PROVIDER
        value: openrouter
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: google/gemma-4-31b-it:free
      - key: AI_FAST_MODEL
        value: google/gemma-4-31b-it:free
      # meta-llama/llama-3.3-70b-instruct:free is no longer offered by OpenRouter
      # (checked against https://openrouter.ai/api/v1/models, Nov 2026).
      - key: AI_FALLBACK_MODEL
        value: google/gemma-4-26b-a4b-it:free
      - key: AI_BASE_URL
        value: https://openrouter.ai/api/v1
      # assisted: dictionary entries applied directly + model only with Duala references
      # (anti-invention check). strict: null whenever evidence is missing. See docs/AI_CONFIGURATION.md.
      - key: TRANSLATION_MODE
        value: "assisted"
      # --- Storage: the knowledge base ships with the code -------------------------
      # data/knowledge/douala.json is versioned in Git and loaded at startup. Writes made on
      # the server (admin approvals, corrections) stay in memory and are lost on restart:
      # the free disk is wiped, and that is intended. To keep a change, make it in the
      # repository (pnpm ingest / edit the file), commit and push. No Supabase.
      - key: ALLOW_EPHEMERAL_STORAGE
        value: "true"
      # --- Security ---------------------------------------------------------------
      - key: ADMIN_API_TOKEN
        generateValue: true
      # Only this extension id may call the API from a browser (CORS).
      - key: CORS_ALLOWED_ORIGINS
        value: chrome-extension://egmamnfapihdpbmnamooaabbafmncpbh
      - key: RATE_LIMIT_MAX
        value: "60"
      - key: LOG_LEVEL
        value: info
